name: Build Sentinel Windows & Android Agents

on:
  push:
    branches:
      - feature/firebase-web-edr-mvp
    tags:
      - "v*"
    paths:
      - "windows_agent/**"
      - "android_agent/**"
      - ".github/workflows/windows-agent-build.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v1.0.3) to publish a GitHub Release"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sentinel-agents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        shell: pwsh
        run: dotnet restore windows_agent/SentinelAgent.sln

      - name: Run Windows agent unit tests
        shell: pwsh
        run: dotnet test windows_agent/tests/Sentinel.Agent.Tests/Sentinel.Agent.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=sentinel-agent-tests.trx" --results-directory artifacts/test-results

      - name: Publish self-contained Windows service
        shell: pwsh
        run: |
          $serviceOut = Join-Path $env:GITHUB_WORKSPACE "artifacts/service"
          dotnet publish windows_agent/src/Sentinel.Agent.Service/Sentinel.Agent.Service.csproj --configuration Release --runtime win-x64 --self-contained true --output $serviceOut -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          if (!(Test-Path (Join-Path $serviceOut "Sentinel.Agent.Service.exe"))) { throw "Self-contained service EXE was not produced." }

      - name: Embed service payload into installer
        shell: pwsh
        run: |
          $payload = Join-Path $env:GITHUB_WORKSPACE "windows_agent/src/Sentinel.Agent.Installer/Payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item "artifacts/service/Sentinel.Agent.Service.exe" (Join-Path $payload "Sentinel.Agent.Service.exe") -Force

      - name: Publish self-contained installer
        shell: pwsh
        run: |
          $installerOut = Join-Path $env:GITHUB_WORKSPACE "artifacts/installer"
          dotnet publish windows_agent/src/Sentinel.Agent.Installer/Sentinel.Agent.Installer.csproj --configuration Release --runtime win-x64 --self-contained true --output $installerOut -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          if (!(Test-Path (Join-Path $installerOut "SentinelAgentSetup.exe"))) { throw "Installer EXE was not produced." }

      - name: Assemble distributable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          Copy-Item "artifacts/installer/SentinelAgentSetup.exe" "artifacts/package/SentinelAgentSetup.exe"
          Copy-Item "docs/WINDOWS_AGENT_INSTALLATION.md" "artifacts/package/INSTALLATION.md"
          Copy-Item "docs/WINDOWS_AGENT_SECURITY.md" "artifacts/package/SECURITY.md"
          $hash = (Get-FileHash "artifacts/package/SentinelAgentSetup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "artifacts/package/SHA256SUMS-windows.txt" -Value "$hash  SentinelAgentSetup.exe"
          Compress-Archive -Path "artifacts/package/*" -DestinationPath "artifacts/SentinelAgent-Windows-x64.zip" -Force

      - name: Upload installer and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAgent-Windows-x64-${{ github.sha }}
          path: |
            artifacts/SentinelAgent-Windows-x64.zip
            artifacts/package/SentinelAgentSetup.exe
            artifacts/package/SHA256SUMS-windows.txt
            artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAgent-Windows-build-diagnostics-${{ github.sha }}
          path: |
            artifacts/test-results/
            windows_agent/**/bin/Release/
          if-no-files-found: ignore
          retention-days: 7

  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 35 components
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" | sort -V | tail -n 1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests
        working-directory: android_agent
        run: gradle testDebugUnitTest --no-daemon

      - name: Generate signing keystore in runner temp
        run: |
          KS_PASS=$(openssl rand -hex 16)
          KEYSTORE_PATH="$RUNNER_TEMP/sentinel-release.jks"
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias sentinel_agent -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Sentinel SOC Agent, OU=Security, O=SentinelSOC, L=Local, S=Local, C=US"
          echo "SENTINEL_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SENTINEL_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "SENTINEL_KEY_ALIAS=sentinel_agent" >> "$GITHUB_ENV"
          echo "SENTINEL_KEY_PASS=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android_agent
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signature and package checksum
        run: |
          mkdir -p artifacts/android
          APK_SRC="android_agent/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Release APK not found at $APK_SRC"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_SRC"
          fi
          cp "$APK_SRC" artifacts/android/SentinelAgent.apk
          (cd artifacts/android && sha256sum SentinelAgent.apk > SHA256SUMS-android.txt)
          cat artifacts/android/SHA256SUMS-android.txt

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAgent-Android-${{ github.sha }}
          path: |
            artifacts/android/SentinelAgent.apk
            artifacts/android/SHA256SUMS-android.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [build-test-package, build-android-apk]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows & Android artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare combined release files
        run: |
          mkdir -p final-release
          cp release-assets/SentinelAgent-Windows-x64-${{ github.sha }}/SentinelAgentSetup.exe final-release/
          cp release-assets/SentinelAgent-Windows-x64-${{ github.sha }}/SentinelAgent-Windows-x64.zip final-release/
          cp release-assets/SentinelAgent-Android-${{ github.sha }}/SentinelAgent.apk final-release/
          cat \
            release-assets/SentinelAgent-Windows-x64-${{ github.sha }}/SHA256SUMS-windows.txt \
            release-assets/SentinelAgent-Android-${{ github.sha }}/SHA256SUMS-android.txt \
            > final-release/SHA256SUMS.txt
          cat final-release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: Sentinel Endpoint Agents (Windows + Android) ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: |
            final-release/SentinelAgentSetup.exe
            final-release/SentinelAgent-Windows-x64.zip
            final-release/SentinelAgent.apk
            final-release/SHA256SUMS.txt
