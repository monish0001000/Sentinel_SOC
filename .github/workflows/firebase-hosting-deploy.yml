name: Deploy Sentinel UI to Firebase Hosting

on:
  push:
    branches:
      - feature/firebase-web-edr-mvp
    paths:
      - c2_core/UI/**
      - firebase.json
      - .github/workflows/firebase-hosting-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-production
    defaults:
      run:
        working-directory: c2_core/UI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: c2_core/UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production UI
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy Firebase Hosting
        working-directory: .
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx -y firebase-tools@15.37.0 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
