name: Deploy Sentinel UI to Firebase Hosting

on:
  push:
    branches:
      - feature/firebase-web-edr-mvp
    paths:
      - c2_core/UI/**
      - firebase.json
      - .github/workflows/firebase-hosting-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/firebase-web-edr-mvp'
    runs-on: ubuntu-latest
    environment: firebase-production
    defaults:
      run:
        working-directory: c2_core/UI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: c2_core/UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and TypeScript check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build production UI
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Verify Firebase environment variables
        working-directory: .
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Error: FIREBASE_PROJECT_ID variable is not set in the firebase-production environment." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy Firebase Hosting
        working-directory: .
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx -y firebase-tools@15.37.0 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
