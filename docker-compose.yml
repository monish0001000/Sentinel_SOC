services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sentinel_net

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: sentinel_logs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sentinel_logs"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sentinel_net

  c2_core:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["python", "main.py"]
    restart: unless-stopped
    volumes:
      - ./c2_core:/app
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: sentinel_logs
      ROLE: c2
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8765:8765"
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - sentinel_net

  dashboard:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    restart: unless-stopped
    volumes:
      - ./c2_core/UI:/app
      - dashboard_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - c2_core
    networks:
      - sentinel_net

networks:
  sentinel_net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  dashboard_node_modules:
